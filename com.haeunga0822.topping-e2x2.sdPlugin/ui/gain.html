<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<script src="sdpi-components.js"></script>
</head>
<body>
	<div id="fields"></div>
	<script src="update-check.js"></script>
	<script src="common.js"></script>
	<script src="target.js"></script>
	<script>
		// Digital gain key and dial (inputs only). The action UUID picks the fields.
		const MODES = { step: 'Step', set: 'Set' }
		mountPI((type, s) => {
			let html = select('input', 'Input', INPUTS, 'placeholder="Select"') + nameField(INPUTS[s.input])
			if (type === 'gain-dial') return html + text('step', 'Step per tick (dB)', '1', '1')
			html += select('mode', 'Mode', MODES, 'default="step"')
			return html + (s.mode === 'set' ? text('db', 'Gain (dB, 0 to +20)', '0') : text('step', 'Step (dB, negative = down)', '1', '1'))
		}, ['mode', 'input'])
	</script>
</body>
</html>
