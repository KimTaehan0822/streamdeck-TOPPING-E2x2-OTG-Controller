<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<script src="sdpi-components.js"></script>
</head>
<body>
	<div id="fields"></div>
	<script src="common.js"></script>
	<script src="target.js"></script>
	<script>
		// TOPPING app restart key. Sync: save the Stream Deck values into the app's open workspace, then restart. Plain: just restart.
		const MODES = { sync: 'Save Stream Deck values, then restart', plain: 'Just restart' }
		const HELP = {
			sync: 'Saves the Stream Deck values into the workspace the TOPPING app has open, then restarts the app with it.',
			plain: 'Restarts the TOPPING app without saving. The app sends its saved workspace to the device, and the keys follow it.',
		}
		mountPI((type, s) => select('mode', 'Mode', MODES, 'default="sync"') + `<div class="notice"><span>${HELP[s.mode === 'plain' ? 'plain' : 'sync']}</span></div>`, ['mode'])
	</script>
</body>
</html>
